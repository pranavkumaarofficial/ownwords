[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ownwords"
version = "0.1.0"
description = "Rewrite a draft into your own measured writing style, locally, and check whether it worked."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pranav Kumaar Sridhar" }]
dependencies = []

[project.scripts]
ownwords = "ownwords.cli:main"

[tool.setuptools.packages.find]
include = ["ownwords*"]
